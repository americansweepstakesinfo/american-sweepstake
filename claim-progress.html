<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="Logo1.png.png" />
  <title>Test Progress Simulation</title>
    <style>
        body{box-sizing:border-box;margin:0;min-height:100vh;padding:24px;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0047ab,#ff0000);color:#fff;display:flex;align-items:center;justify-content:center}
        .card{box-sizing:border-box;background:rgba(255,255,255,0.06);padding:28px;border-radius:12px;max-width:820px;width:94%;text-align:center;border:1px solid rgba(255,255,255,0.12)}
        .logo{display:block;max-width:min(220px,80%);max-height:140px;object-fit:contain;margin:0 auto 18px}
        h1{margin:0 0 8px;font-size:22px;color:#ffd700}
        p.note{color:#e8f4ff;margin:8px 0 18px}
        .progress-container{width:100%;max-width:600px;height:30px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.35);border-radius:25px;overflow:hidden;margin:20px auto}
        .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#e70808,#1100ff);text-align:center;line-height:30px;color:#002;font-weight:700;transition:width 1s linear}
        .message{margin-top:16px;color:#fff}
        a.btn{display:inline-block;margin-top:18px;padding:10px 16px;border-radius:999px;background:linear-gradient(90deg,#ffd700,#ff8a00);color:#000;font-weight:700;text-decoration:none}
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="Picture3.png" alt="Logo">
        <h1>90-Minute Test Simulation</h1>
        <p class="note">This is a test-only progress animation. It does not submit or review a claim, process a payment, or report a real status.</p>

        <div class="progress-container" role="progressbar" aria-label="Test simulation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <p class="note">No form information is stored or sent by this simulation.</p>
        <p class="message" id="timer" aria-live="off">90:00 remaining</p>
        <a class="btn" href="index.html">Return Home</a>
    </main>

    <script>
        const totalTime = 90 * 60; // 90 minutes in seconds
        let elapsedTime = 0;

        const progressBar = document.getElementById('progressBar');
        const timerDisplay = document.getElementById('timer');

        function updateProgress() {
            elapsedTime++;

            // Calculate percentage
            const percent = (elapsedTime / totalTime) * 100;
            progressBar.style.width = percent + "%";
            progressBar.textContent = Math.floor(percent) + "%";
            progressBar.parentElement.setAttribute('aria-valuenow', String(Math.floor(percent)));

            // Calculate remaining time
            const remaining = totalTime - elapsedTime;
            const minutes = Math.floor(remaining / 60);
            const seconds = remaining % 60;
            timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')} remaining`;

            // Stop when time is up
            if (elapsedTime >= totalTime) {
                clearInterval(interval);
                progressBar.textContent = "Complete";
                timerDisplay.textContent = "00:00 remaining";
            }
        }

        // Update every second
        const interval = setInterval(updateProgress, 1000);
    </script>

</body>
</html>
